<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Arcade Edition</title>
    <meta name="description" content="A modern, high-performance Flappy Bird game built with HTML5 Canvas, Web Audio API, multiple skins, and particle effects.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app-container">
        <!-- Canvas Render Target -->
        <canvas id="game-canvas"></canvas>

        <!-- Top HUD Elements -->
        <header id="hud">
            <div class="score-display" id="hud-score">0</div>
            <div class="top-controls">
                <button class="icon-btn" id="btn-fullscreen" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">⛶</button>
                <button class="icon-btn" id="btn-sound" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
                <button class="icon-btn" id="btn-music" title="Toggle Music" aria-label="Toggle Music">🎵</button>
                <button class="icon-btn" id="btn-pause" title="Pause Game" aria-label="Pause Game">⏸️</button>
            </div>
        </header>

        <!-- Ready / Tap Hint Indicator -->
        <div id="get-ready-hint">
            <div class="tap-icon">👆</div>
            <div class="tap-text">Tap or Press Space to Flap</div>
        </div>

        <!-- Start / Title Screen Overlay -->
        <section class="overlay-screen active" id="start-screen">
            <div class="game-title-container">
                <h1 class="game-title">Flappy Bird</h1>
                <div class="game-subtitle">Arcade Edition</div>
            </div>

            <div class="glass-card">
                <!-- Skin Selection -->
                <div class="option-row">
                    <span class="option-label">Choose Bird:</span>
                    <div class="skin-selector">
                        <button class="skin-btn active" data-skin="gold" title="Golden Bird">🐥</button>
                        <button class="skin-btn" data-skin="cyber" title="Cyber Neon">🤖</button>
                        <button class="skin-btn" data-skin="crimson" title="Phoenix">🦅</button>
                        <button class="skin-btn" data-skin="bat" title="Midnight Bat">🦇</button>
                    </div>
                </div>

                <!-- Difficulty Selection -->
                <div class="option-row">
                    <span class="option-label">Difficulty:</span>
                    <div class="difficulty-group">
                        <button class="diff-btn" data-diff="casual">Easy</button>
                        <button class="diff-btn active" data-diff="classic">Normal</button>
                        <button class="diff-btn" data-diff="hard">Hard</button>
                    </div>
                </div>

                <!-- High Score Banner -->
                <div class="option-row" style="justify-content: center; font-size: 0.95rem; color: var(--gold); font-weight: 700;">
                    🏆 Best Score: <span id="start-best-score" style="margin-left: 6px;">0</span>
                </div>

                <button class="btn-primary" id="btn-start-game">
                    <span>PLAY NOW</span> 🎮
                </button>

                <div class="controls-guide">
                    <span><span class="key-badge">SPACE</span> / <span class="key-badge">↑</span> Jump</span>
                    <span><span class="key-badge">CLICK</span> / <span class="key-badge">TAP</span> Screen</span>
                </div>
            </div>
        </section>

        <!-- Game Over Screen Overlay -->
        <section class="overlay-screen" id="game-over-screen">
            <div class="glass-card">
                <h2 class="game-over-title">GAME OVER</h2>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-label">Score</span>
                        <span class="stat-value" id="final-score">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Best</span>
                        <span class="stat-value high-score" id="best-score">0</span>
                    </div>
                    <div class="medal-box" id="medal-container">
                        <span class="medal-icon" id="medal-icon">🥉</span>
                        <span class="medal-text" id="medal-name">Bronze Medal</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" id="btn-restart">
                        <span>RETRY</span> 🔄
                    </button>
                    <button class="btn-secondary" id="btn-menu">
                        <span>MENU</span> 🏠
                    </button>
                </div>
            </div>
        </section>

        <!-- Pause Screen Overlay -->
        <section class="overlay-screen" id="pause-screen">
            <div class="glass-card" style="text-align: center;">
                <h2 class="game-title" style="font-size: 2.2rem; margin-bottom: 8px;">PAUSED</h2>
                <p style="color: var(--text-muted); margin-bottom: 16px; font-size: 0.9rem;">Take a breath, champion!</p>
                <button class="btn-primary" id="btn-resume">
                    <span>RESUME</span> ▶️
                </button>
                <button class="btn-secondary" id="btn-pause-menu" style="margin-top: 10px; width: 100%;">
                    <span>QUIT TO MENU</span> 🏠
                </button>
            </div>
        </section>
    </main>

    <!-- Game Scripts -->
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
